<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Troubleshooting Simulator - Socratic Lab Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Marked JS for Rendering Markdown in Chat -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            font-family: 'Prompt', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .chat-bubble-user {
            background-color: #2563eb;
            color: white;
            border-radius: 1.25rem 1.25rem 0.25rem 1.25rem;
        }
        .chat-bubble-ai {
            background-color: #f1f5f9;
            color: #0f172a;
            border-radius: 1.25rem 1.25rem 1.25rem 0.25rem;
        }
        .prose p { margin-bottom: 0.5rem; }
        .prose ul { list-style-type: disc; margin-left: 1.25rem; }
        .prose ol { list-style-type: decimal; margin-left: 1.25rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const PRESET_SCENARIOS = [
            {
                id: 'scenario-a',
                title: 'Scenario A: Titration Analysis Error',
                category: 'Titrimetric',
                description: 'ไทเทรตหาความเข้มข้นของ CH₃COOH ด้วยสารมาตรฐาน NaOH โดยใช้ Phenolphthalein แต่ผลที่ได้มีความเข้มข้นสูงกว่าค่าจริงอย่างมีนัยสำคัญทุกครั้งที่ทำ (%Error สูงทางบวกอย่างต่อเนื่อง)',
                symptom: 'ความเข้มข้น acetic acid คำนวณได้สูงกว่าความเป็นจริง 15% ทุก Replicate',
                tags: ['Volumetric', 'Systematic Error', 'Indicator']
            },
            {
                id: 'scenario-b',
                title: 'Scenario B: UV-Vis Beer\'s Law Deviation',
                category: 'Spectrophotometry',
                description: 'สร้าง Calibration Curve ของ Iron-Phenanthroline Complex ที่ความเข้มข้นสูง ค่า Absorbance เริ่มไม่เป็นเส้นตรง (กราฟโค้งเบี่ยงเบนลง) และค่า R² = 0.978',
                symptom: 'กราฟสอบมาตรฐานเบี่ยงเบนออกแนวเส้นตรงเมื่อความเข้มข้น > 10 ppm',
                tags: ['UV-Vis', 'Beer-Lambert Law', 'Non-linear']
            },
            {
                id: 'scenario-c',
                title: 'Scenario C: Spike Recovery High Error',
                category: 'QA/QC & Sample Prep',
                description: 'ทำการทดสอบ Spike Recovery ของโลหะหนักในน้ำเสีย ได้ค่า %Recovery เท่ากับ 145% ซึ่งเกินเกณฑ์มาตรฐาน QA/QC ที่กำหนด (80–120%)',
                symptom: '%Recovery พุ่งสูงถึง 145% ในการวิเคราะห์โลหะหนักด้วย AAS',
                tags: ['QA/QC', 'Matrix Effect', 'Contamination']
            },
            {
                id: 'scenario-d',
                title: 'Scenario D: High Cuvette Blank Value',
                category: 'Spectrophotometry',
                description: 'ทำแล็บวัดค่า Absorbance ของสารละลาย Cu²⁺ แล้วค่า Blank สูงผิดปกติ (Abs = 0.350) ทำให้อ่านค่าสารตัวอย่างคลาดเคลื่อนหนักมาก',
                symptom: 'Reagent Blank อ่านค่า Absorbance ได้ 0.350 (ควรจะ < 0.01)',
                tags: ['Spectroscopy', 'Blank Contamination', 'Cuvette Handling']
            }
        ];

        const SYSTEM_PROMPT = `คุณคือ "Dr. Ana" สตาฟฟ์ผู้เชี่ยวชาญประจำห้องปฏิบัติการเคมีวิเคราะห์ที่มีประสบการณ์สูง
หน้าที่ของคุณคือช่วยเหลือนักศึกษาชั้นปีที่ 2 ในการวิเคราะห์หาสาเหตุเมื่อการทดลองเกิดความผิดพลาด (Lab Troubleshooting)

[บริบททางเคมีวิเคราะห์ที่ต้องครอบคลุม]
1. Titrimetric Analysis: Overshot endpoint, Carbonate error, Indicator range mismatch, Buret parallax error
2. Spectrophotometry (UV-Vis): Stray light, Matrix interference, Cuvette mismatch/fingerprints, Non-linear Beer's law plot
3. Gravimetric & Volumetric Analysis: Incomplete drying, Moisture absorption, Volumetric glassware miscalibration
4. Data Quality & QA/QC: Blank contamination, R^2 < 0.995, %Recovery OUT OF 80-120%, %RSD > 5%

[กฎเหล็กในการโต้ตอบ - STRICT RULES]
1. ห้ามเฉลยสาเหตุหรือคำตอบตรงๆ เด็ดขาด! (DO NOT GIVE DIRECT ANSWERS)
2. ใช้แนวทาง Socratic Method: ตอบกลับด้วยการถามคำถามชวนคิด "ทีละ 1 คำถามเท่านั้น" ในแต่ละรอบ (หรือเน้นกระตุ้นความคิดสั้นๆ)
3. นำทางให้นักศึกษาแยกแยะระหว่าง Systematic Error กับ Random Error ให้ได้
4. หากนักศึกษาตอบถูก ให้ชื่นชมและกระตุ้นให้เสนอ "วิธีแก้ไขในครั้งหน้า (Corrective Action)"
5. หากข้อมูลไม่พอ ให้ถามถึงขั้นตอนปฏิบัติ เช่น การเตรียมสาร (Sample Prep), การล้างอุปกรณ์, การ Calibration
6. Safety First: หากมีการกล่าวถึงการจัดการสารเคมี ให้เตือนนักศึกษาอ้างอิง Safety Data Sheet (SDS) และระเบียบความปลอดภัยเสมอ
7. Do Not Calculate: ไม่ต้องคำนวณตัวเลขซับซ้อนให้ หรือสรุปค่าคงที่ทางเคมีให้โดยตรง แต่ให้กระตุ้นให้นักศึกษาตรวจสอบจากเอกสารอ้างอิงมาตรฐาน (เช่น Vogel หรือ Skoog)
8. ตอบเป็นภาษาไทยอย่างสุภาพ กระตุกความคิด ใช้ภาษาวิทยาศาสตร์ที่ถูกต้องสั้นกระชับ`;

        function App() {
            const [activeTab, setActiveTab] = useState('simulator'); // 'simulator', 'blueprint', 'reference'
            const [selectedScenario, setSelectedScenario] = useState(PRESET_SCENARIOS[0]);
            const [messages, setMessages] = useState([]);
            const [inputMessage, setInputMessage] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [customScenarioInput, setCustomScenarioInput] = useState('');

            // Lab Incident Resolution Sheet State
            const [report, setReport] = useState({
                studentName: '',
                studentId: '',
                labTitle: PRESET_SCENARIOS[0].title,
                symptom: PRESET_SCENARIOS[0].symptom,
                errorType: 'Systematic Error',
                rootCause: '',
                correctiveAction: '',
                sdsNotes: ''
            });

            const [copied, setCopied] = useState(false);
            const messagesEndRef = useRef(null);

            // Auto scroll chat
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isLoading]);

            // Initialize chat on scenario selection
            useEffect(() => {
                resetChatForScenario(selectedScenario);
            }, [selectedScenario]);

            const resetChatForScenario = (scenario) => {
                setReport(prev => ({
                    ...prev,
                    labTitle: scenario.title,
                    symptom: scenario.symptom,
                    rootCause: '',
                    correctiveAction: ''
                }));

                const initialAiMsg = {
                    role: 'model',
                    text: `สวัสดีครับ/ค่ะนักศึกษา! ครูคือ **Dr. Ana** ประจำแล็บเคมีวิเคราะห์ครับ

จากการรายงานพบปัญหาใน **"${scenario.title}"** 
*อาการที่พบ:* ${scenario.symptom}

ลองวิเคราะห์เบื้องต้นดูหน่อยครับว่า ปรากฏการณ์นี้คิดว่าเป็น **Systematic Error (ข้อผิดพลาดเชิงระบบ)** หรือ **Random Error (ข้อผิดพลาดแบบสุ่ม)** เพราะเหตุใดครับ?`
                };
                setMessages([initialAiMsg]);
            };

            const handleSendMessage = async (e) => {
                e && e.preventDefault();
                if (!inputMessage.trim() || isLoading) return;

                const userMsgText = inputMessage.trim();
                setInputMessage('');

                const newMessages = [...messages, { role: 'user', text: userMsgText }];
                setMessages(newMessages);
                setIsLoading(true);

                try {
                    // Prepare Gemini API payload
                    const chatHistory = newMessages.map(m => ({
                        role: m.role === 'user' ? 'user' : 'model',
                        parts: [{ text: m.text }]
                    }));

                    const payload = {
                        contents: chatHistory,
                        systemInstruction: {
                            parts: [{ text: SYSTEM_PROMPT }]
                        }
                    };

                    const apiKey = ""; // Canvas runtime auto-injects key
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "ขออภัยครับ Dr. Ana ไม่สามารถประมวลผลคำตอบได้ในขณะนี้ ลองใหม่อีกครั้งนะครับ";

                    setMessages([...newMessages, { role: 'model', text: aiText }]);
                } catch (error) {
                    console.error("Error communicating with Gemini API:", error);
                    setMessages([...newMessages, { 
                        role: 'model', 
                        text: "⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อกับ Dr. Ana กรุณาตรวจสอบอินเทอร์เน็ตหรือลองส่งข้อความอีกครั้งครับ" 
                    }]);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleCustomScenarioSelect = () => {
                if (!customScenarioInput.trim()) return;
                const newScenario = {
                    id: `custom-${Date.now()}`,
                    title: 'Custom Problem: ปัญหาแล็บกำหนดเอง',
                    category: 'General Lab',
                    description: customScenarioInput,
                    symptom: customScenarioInput,
                    tags: ['Custom', 'Troubleshooting']
                };
                setSelectedScenario(newScenario);
                setCustomScenarioInput('');
            };

            const copyReportToClipboard = () => {
                const reportContent = `
=========================================
LAB INCIDENT RESOLUTION SHEET
รายวิชา: เคมีวิเคราะห์ (Analytical Chemistry)
=========================================
นักศึกษา: ${report.studentName || '-'} (รหัส: ${report.studentId || '-'})
หัวข้อแล็บ/สถานการณ์: ${report.labTitle}
อาการ/ปัญหาที่พบ (Symptom): ${report.symptom}
-----------------------------------------
1. ชนิดของ Error: ${report.errorType}
2. สาเหตุรากเหง้า (Root Cause Analysis):
${report.rootCause || '-'}

3. แนวทางแก้ไขและปรับปรุง SOP (Corrective & Preventive Action):
${report.correctiveAction || '-'}

4. ข้อควรระวังด้านความปลอดภัย (Safety & SDS Notes):
${report.sdsNotes || '-'}
=========================================
`.trim();

                const textarea = document.createElement('textarea');
                textarea.value = reportContent;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);

                setCopied(true);
                setTimeout(() => setCopied(false), 2500);
            };

            return (
                <div className="flex flex-col h-screen max-h-screen overflow-hidden bg-slate-900 text-slate-100">
                    {/* Header Bar */}
                    <header className="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between shrink-0 shadow-md">
                        <div className="flex items-center space-x-3">
                            <div className="bg-emerald-500 text-slate-900 p-2 rounded-lg font-bold flex items-center justify-center w-10 h-10 shadow-lg">
                                <i className="fa-solid font-flask text-lg"></i>
                                <i className="fa-solid fa-flask-vial"></i>
                            </div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight text-emerald-400">Lab Troubleshooting Simulator</h1>
                                <p className="text-xs text-slate-400">Socratic Lab Companion: Dr. Ana (Analytical Chemistry)</p>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700 text-sm">
                            <button
                                onClick={() => setActiveTab('simulator')}
                                className={`px-3 py-1.5 rounded-md font-medium transition ${activeTab === 'simulator' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                            >
                                <i className="fa-solid fa-comments mr-2"></i>Simulator Chat
                            </button>
                            <button
                                onClick={() => setActiveTab('blueprint')}
                                className={`px-3 py-1.5 rounded-md font-medium transition ${activeTab === 'blueprint' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                            >
                                <i className="fa-solid fa-file-lines mr-2"></i>Use Case Blueprint
                            </button>
                            <button
                                onClick={() => setActiveTab('reference')}
                                className={`px-3 py-1.5 rounded-md font-medium transition ${activeTab === 'reference' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                            >
                                <i className="fa-solid fa-book-bookmark mr-2"></i>Error & Safety Guide
                            </button>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    {activeTab === 'simulator' && (
                        <div className="flex-1 flex overflow-hidden">
                            {/* Left Sidebar: Scenario Selector & Preset Data */}
                            <div className="w-80 bg-slate-800 border-r border-slate-700 flex flex-col shrink-0">
                                <div className="p-4 border-b border-slate-700">
                                    <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
                                        <i className="fa-solid fa-vial mr-1.5 text-emerald-400"></i> เลือกคลังโจทย์ปัญหาแล็บ
                                    </h2>
                                    <div className="space-y-2">
                                        {PRESET_SCENARIOS.map((scen) => (
                                            <button
                                                key={scen.id}
                                                onClick={() => setSelectedScenario(scen)}
                                                className={`w-full text-left p-3 rounded-lg border transition text-xs ${selectedScenario.id === scen.id ? 'bg-emerald-950/60 border-emerald-500 text-emerald-200 shadow-sm' : 'bg-slate-900/60 border-slate-700/60 text-slate-300 hover:bg-slate-700/50'}`}
                                            >
                                                <div className="font-semibold text-sm mb-1 text-slate-100 flex items-center justify-between">
                                                    <span>{scen.title.split(':')[0]}</span>
                                                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300">{scen.category}</span>
                                                </div>
                                                <p className="line-clamp-2 text-slate-400">{scen.description}</p>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Custom Scenario Input */}
                                <div className="p-4 border-b border-slate-700 bg-slate-850">
                                    <label className="block text-xs font-semibold text-slate-400 mb-2">
                                        <i className="fa-solid fa-pen-to-square mr-1 text-emerald-400"></i> หรือป้อนปัญหาจากแล็บของคุณเอง
                                    </label>
                                    <textarea
                                        rows="2"
                                        value={customScenarioInput}
                                        onChange={(e) => setCustomScenarioInput(e.target.value)}
                                        placeholder="เช่น ไทเทรตแล้วจุดยุติเลยสีชมพูเข้มมาก หรือกราฟ UV-Vis เบี้ยว..."
                                        className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                                    ></textarea>
                                    <button
                                        onClick={handleCustomScenarioSelect}
                                        disabled={!customScenarioInput.trim()}
                                        className="mt-2 w-full bg-slate-700 hover:bg-emerald-600 disabled:opacity-50 text-white text-xs py-1.5 rounded transition font-medium"
                                    >
                                        เริ่มต้นจำลองปัญหานี้
                                    </button>
                                </div>

                                {/* Active Scenario Info Box */}
                                <div className="p-4 flex-1 overflow-y-auto bg-slate-900/40">
                                    <div className="bg-slate-900/80 p-3 rounded-lg border border-slate-700">
                                        <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">โจทย์ปัจจุบัน</span>
                                        <h3 className="font-semibold text-slate-200 text-xs mt-1">{selectedScenario.title}</h3>
                                        <p className="text-xs text-slate-300 mt-2 bg-slate-800 p-2 rounded border border-slate-700/50">
                                            {selectedScenario.description}
                                        </p>
                                        <div className="mt-2 flex flex-wrap gap-1">
                                            {selectedScenario.tags.map((tag, idx) => (
                                                <span key={idx} className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded">
                                                    #{tag}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Middle Column: Chat Interface with Dr. Ana */}
                            <div className="flex-1 flex flex-col bg-slate-900 border-r border-slate-700">
                                {/* Chat Header */}
                                <div className="bg-slate-800/80 px-4 py-2.5 border-b border-slate-700 flex items-center justify-between">
                                    <div className="flex items-center space-x-2">
                                        <div className="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-xs shadow">
                                            Dr
                                        </div>
                                        <div>
                                            <h2 className="text-sm font-semibold text-slate-200">Dr. Ana (Socratic Companion)</h2>
                                            <p className="text-[11px] text-emerald-400 flex items-center">
                                                <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full mr-1.5 animate-pulse"></span>
                                                พร้อมตอบแบบโสเครติส (ไม่เฉลยคำตอบตรงๆ)
                                            </p>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => resetChatForScenario(selectedScenario)}
                                        className="text-xs text-slate-400 hover:text-slate-200 px-2 py-1 rounded bg-slate-700/50 hover:bg-slate-700 transition"
                                        title="เริ่มบทสนทนาใหม่"
                                    >
                                        <i className="fa-solid fa-rotate-right mr-1"></i> รีเซ็ตแชท
                                    </button>
                                </div>

                                {/* Chat Messages List */}
                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {messages.map((msg, idx) => (
                                        <div
                                            key={idx}
                                            className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                                        >
                                            <div className={`max-w-[85%] ${msg.role === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'} p-3 text-sm shadow-md`}>
                                                {msg.role === 'model' && (
                                                    <div className="text-[10px] font-bold text-emerald-600 mb-1 flex items-center">
                                                        <i className="fa-solid fa-user-graduate mr-1"></i> Dr. Ana
                                                    </div>
                                                )}
                                                <div 
                                                    className="prose prose-invert max-w-none text-sm leading-relaxed"
                                                    dangerouslySetInnerHTML={{ __html: marked.parse(msg.text) }}
                                                />
                                            </div>
                                        </div>
                                    ))}

                                    {isLoading && (
                                        <div className="flex justify-start">
                                            <div className="chat-bubble-ai p-3 text-sm flex items-center space-x-2 text-slate-400">
                                                <i className="fa-solid fa-circle-notch fa-spin text-emerald-500"></i>
                                                <span className="text-xs">Dr. Ana กำลังตั้งคำถามชวนคิด...</span>
                                            </div>
                                        </div>
                                    )}
                                    <div ref={messagesEndRef} />
                                </div>

                                {/* Chat Input Form */}
                                <form onSubmit={handleSendMessage} className="p-3 bg-slate-800 border-t border-slate-700 flex space-x-2">
                                    <input
                                        type="text"
                                        value={inputMessage}
                                        onChange={(e) => setInputMessage(e.target.value)}
                                        placeholder="พิมพ์คำตอบ การวิเคราะห์ หรือคำถามตอบกลับถึง Dr. Ana..."
                                        className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 placeholder-slate-500"
                                        disabled={isLoading}
                                    />
                                    <button
                                        type="submit"
                                        disabled={isLoading || !inputMessage.trim()}
                                        className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-medium px-4 py-2 rounded-lg text-sm transition shadow flex items-center"
                                    >
                                        <span>ส่ง</span>
                                        <i className="fa-solid fa-paper-plane ml-2 text-xs"></i>
                                    </button>
                                </form>
                            </div>

                            {/* Right Column: Lab Incident Resolution Sheet */}
                            <div className="w-96 bg-slate-850 border-l border-slate-700 flex flex-col shrink-0 bg-slate-800/60">
                                <div className="p-3 bg-slate-800 border-b border-slate-700 flex items-center justify-between">
                                    <h2 className="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center">
                                        <i className="fa-solid fa-clipboard-check text-emerald-400 mr-2 text-sm"></i>
                                        Lab Incident Sheet
                                    </h2>
                                    <button
                                        onClick={copyReportToClipboard}
                                        className="bg-emerald-700 hover:bg-emerald-600 text-white text-xs px-2.5 py-1 rounded transition flex items-center shadow"
                                    >
                                        <i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'} mr-1.5`}></i>
                                        {copied ? 'คัดลอกแล้ว!' : 'คัดลอกใบบันทึก'}
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 space-y-3 text-xs">
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-400 mb-1">ชื่อนักศึกษา</label>
                                            <input
                                                type="text"
                                                value={report.studentName}
                                                onChange={(e) => setReport({ ...report, studentName: e.target.value })}
                                                placeholder="สมชาย รักเรียน"
                                                className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">รหัสนักศึกษา</label>
                                            <input
                                                type="text"
                                                value={report.studentId}
                                                onChange={(e) => setReport({ ...report, studentId: e.target.value })}
                                                placeholder="6505xxxx"
                                                className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-slate-400 mb-1">อาการ/ปัญหาที่พบ (Symptom)</label>
                                        <textarea
                                            rows="2"
                                            value={report.symptom}
                                            onChange={(e) => setReport({ ...report, symptom: e.target.value })}
                                            className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-slate-400 mb-1">ประเภทของ ข้อผิดพลาด (Error Type)</label>
                                        <select
                                            value={report.errorType}
                                            onChange={(e) => setReport({ ...report, errorType: e.target.value })}
                                            className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200"
                                        >
                                            <option value="Systematic Error (ข้อผิดพลาดเชิงระบบ)">Systematic Error (ข้อผิดพลาดเชิงระบบ)</option>
                                            <option value="Random Error (ข้อผิดพลาดแบบสุ่ม)">Random Error (ข้อผิดพลาดแบบสุ่ม)</option>
                                            <option value="Gross Error / Operator Mistake">Gross Error / Human Error</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-slate-400 mb-1 font-semibold text-emerald-400">
                                            สาเหตุรากเหง้า (Root Cause Analysis)
                                        </label>
                                        <textarea
                                            rows="4"
                                            value={report.rootCause}
                                            onChange={(e) => setReport({ ...report, rootCause: e.target.value })}
                                            placeholder="สรุปจากการสนทนากับ Dr. Ana เช่น สารมาตรฐานสลายตัว, Cuvette สกปรก, หรือเกิด Carbonate Error..."
                                            className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200 focus:border-emerald-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-slate-400 mb-1 font-semibold text-emerald-400">
                                            แนวทางแก้ไข & ปรับปรุง SOP (Corrective Action)
                                        </label>
                                        <textarea
                                            rows="3"
                                            value={report.correctiveAction}
                                            onChange={(e) => setReport({ ...report, correctiveAction: e.target.value })}
                                            placeholder="ระบุวิธีแก้ไขในแล็บครั้งต่อไป เช่น ล้าง Cuvette ด้วยตัวทำละลาย, ต้มไล่ CO₂ ในน้ำกลั่น..."
                                            className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200 focus:border-emerald-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-slate-400 mb-1">
                                            <i className="fa-solid fa-triangle-exclamation text-amber-400 mr-1"></i>
                                            ข้อควรระวังด้านความปลอดภัย / SDS
                                        </label>
                                        <input
                                            type="text"
                                            value={report.sdsNotes}
                                            onChange={(e) => setReport({ ...report, sdsNotes: e.target.value })}
                                            placeholder="การสวม PPE, การกำจัดสารเคมีตกค้าง..."
                                            className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-slate-200"
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIEW TAB 2: USE CASE BLUEPRINT */}
                    {activeTab === 'blueprint' && (
                        <div className="flex-1 overflow-y-auto p-6 bg-slate-900">
                            <div className="max-w-4xl mx-auto bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-xl space-y-6 text-slate-200 text-sm">
                                <div className="border-b border-slate-700 pb-4">
                                    <span className="bg-emerald-900/80 text-emerald-300 text-xs px-2.5 py-1 rounded font-semibold">
                                        Use Case Blueprint
                                    </span>
                                    <h1 className="text-2xl font-bold text-white mt-2">
                                        Lab Troubleshooting Simulator: Socratic Lab Companion
                                    </h1>
                                    <p className="text-slate-400 text-xs mt-1">
                                        รายวิชา: เคมีวิเคราะห์ (Analytical Chemistry - ชั้นปีที่ 2) | กลุ่มเป้าหมาย: นักศึกษาคณะวิทยาศาสตร์ สาขาเคมี
                                    </p>
                                </div>

                                {/* Objectives */}
                                <div>
                                    <h2 className="text-base font-bold text-emerald-400 mb-2 flex items-center">
                                        <i className="fa-solid fa-bullseye mr-2"></i> 1. วัตถุประสงค์การเรียนรู้ที่วัดผลได้ (Measurable Learning Objectives)
                                    </h2>
                                    <ul className="list-disc pl-5 space-y-1.5 text-slate-300">
                                        <li><strong>จำแนกประเภทข้อผิดพลาด (Analyze):</strong> ระบุและจำแนกความแตกต่างระหว่าง Systematic Error และ Random Error จากข้อมูลแล็บที่ผิดปกติได้อย่างน้อย 80%</li>
                                        <li><strong>วิเคราะห์สาเหตุรากเหง้า (Evaluate):</strong> ตั้งสมมติฐานและใช้ตรรกะเคมีวิเคราะห์หาสาเหตุรากเหง้า (Root Cause) ของปัญหาการวัดเชิงปริมาณอย่างเป็นระบบ</li>
                                        <li><strong>เสนอแนวทางแก้ไขและป้องกัน (Create):</strong> ออกแบบกระบวนการแก้ไข (Corrective Action) และปรับปรุงขั้นตอน SOP ได้ถูกต้องตามหลักวิทยาศาสตร์และความปลอดภัย</li>
                                    </ul>
                                </div>

                                {/* System Prompt Document */}
                                <div>
                                    <h2 className="text-base font-bold text-emerald-400 mb-2 flex items-center">
                                        <i className="fa-solid fa-code mr-2"></i> 2. System Prompt ฉบับปรับปรุงละเอียด (Production-Ready Prompt)
                                    </h2>
                                    <pre className="bg-slate-900 p-4 rounded-lg border border-slate-700 text-xs text-emerald-300 overflow-x-auto whitespace-pre-wrap font-mono">
                                        {SYSTEM_PROMPT}
                                    </pre>
                                </div>

                                {/* Workflow */}
                                <div>
                                    <h2 className="text-base font-bold text-emerald-400 mb-2 flex items-center">
                                        <i className="fa-solid fa-diagram-project mr-2"></i> 3. ลำดับขั้นตอนกิจกรรม (Step-by-step Workflow)
                                    </h2>
                                    <div className="grid grid-cols-3 gap-4 text-center text-xs my-3">
                                        <div className="bg-slate-900 p-3 rounded border border-slate-700">
                                            <div className="font-bold text-emerald-400 mb-1">ขั้นที่ 1: Pre-Session</div>
                                            <p className="text-slate-400">นักศึกษาได้รับโจทย์ปัญหาหรือนำข้อมูลจริงจากแล็บมาใช้</p>
                                        </div>
                                        <div className="bg-slate-900 p-3 rounded border border-slate-700">
                                            <div className="font-bold text-emerald-400 mb-1">ขั้นที่ 2: Socratic Chat</div>
                                            <p className="text-slate-400">โต้ตอบกับ Dr. Ana (3-5 Rounds) เพื่อเจาะหาสาเหตุรากเหง้า</p>
                                        </div>
                                        <div className="bg-slate-900 p-3 rounded border border-slate-700">
                                            <div className="font-bold text-emerald-400 mb-1">ขั้นที่ 3: Output</div>
                                            <p className="text-slate-400">บันทึกสกัดความรู้ลงใน Lab Incident Sheet และสรุปส่งอาจารย์</p>
                                        </div>
                                    </div>
                                </div>

                                {/* AI Hallucination Mitigation */}
                                <div>
                                    <h2 className="text-base font-bold text-emerald-400 mb-2 flex items-center">
                                        <i className="fa-solid fa-shield-halved mr-2"></i> 4. กลไกการป้องกัน AI Hallucination
                                    </h2>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr className="bg-slate-900 text-slate-300 border-b border-slate-700">
                                                    <th className="p-2">ประเด็นเสี่ยง Hallucination</th>
                                                    <th className="p-2">ผลกระทบ</th>
                                                    <th className="p-2">แนวทางป้องกัน (Mitigation)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-700 text-slate-300">
                                                <tr>
                                                    <td className="p-2 font-medium text-amber-300">มั่วค่าคงที่ทางเคมี / ตัวเลขคำนวณ</td>
                                                    <td className="p-2">นักศึกษาจำค่า pKa หรือ λmax ที่ผิดไปใช้</td>
                                                    <td className="p-2">ตั้ง Prompt กำหนดให้ AI ไม่ต้องคำนวณตัวเลขซับซ้อนให้ และสั่งให้นักศึกษาครวจสอบทานค่ากับ Skoog / Vogel เสมอ</td>
                                                </tr>
                                                <tr>
                                                    <td className="p-2 font-medium text-amber-300">สับสนชนิด Error</td>
                                                    <td className="p-2">เกิด Misconception ทางทฤษฎี</td>
                                                    <td className="p-2">มี Cheat Sheet ตรวจสอบทาน + อาจารย์สุ่มสแกนบันทึก (Human-in-the-loop)</td>
                                                </tr>
                                                <tr>
                                                    <td className="p-2 font-medium text-amber-300">แนะนำขั้นตอนที่ไม่ปลอดภัย</td>
                                                    <td className="p-2">เกิดอันตรายในแล็บจริง</td>
                                                    <td className="p-2">ใส่ Safety Guardrail ใน Prompt บังคับอ้างอิง Safety Data Sheet (SDS) เสมอ</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIEW TAB 3: ERROR & SAFETY REFERENCE GUIDE */}
                    {activeTab === 'reference' && (
                        <div className="flex-1 overflow-y-auto p-6 bg-slate-900">
                            <div className="max-w-4xl mx-auto space-y-6">
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                                    <h1 className="text-xl font-bold text-white mb-4 flex items-center">
                                        <i className="fa-solid fa-book-open text-emerald-400 mr-2"></i>
                                        คู่มืออ้างอิงเร็ว: การวิเคราะห์ข้อผิดพลาดทางเคมีวิเคราะห์ (Quick Reference)
                                    </h1>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                        <div className="bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-2">
                                            <h2 className="font-bold text-base text-sky-400 flex items-center">
                                                <i className="fa-solid fa-arrows-to-dot mr-2"></i> Systematic Error (เชิงระบบ)
                                            </h2>
                                            <p className="text-slate-300"><strong>ลักษณะ:</strong> เบี่ยงเบนไปในทิศทางเดียว (มีค่าสูงกว่าจริงทั้งหมด หรือต่ำกว่าจริงทั้งหมด) ส่งผลกระทบต่อ <em>Accuracy (ความเที่ยง)</em></p>
                                            <ul className="list-disc pl-4 text-slate-400 space-y-1">
                                                <li><strong>Instrumental Errors:</strong> เครื่องมือไม่ได้ Calibration, pH meter ดริฟท์, Cuvette เป็นรอย/สกปรก</li>
                                                <li><strong>Method Errors:</strong> สารปนเปื้อนใน Blank, Carbonate Error ในการไทเทรต, Indicator เปลี่ยนสีไม่ตรง Endpoint</li>
                                                <li><strong>Personal Errors:</strong> Parallax error อ่านสเกลผิดทิศทางเดิมเสมอ</li>
                                            </ul>
                                        </div>

                                        <div className="bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-2">
                                            <h2 className="font-bold text-base text-purple-400 flex items-center">
                                                <i className="fa-solid fa-shuffle mr-2"></i> Random Error (แบบสุ่ม)
                                            </h2>
                                            <p className="text-slate-300"><strong>ลักษณะ:</strong> กระจัดกระจายสองทิศทางโดยไม่สามารถคาดเดาได้ ส่งผลกระทบต่อ <em>Precision (ความแม่น)</em></p>
                                            <ul className="list-disc pl-4 text-slate-400 space-y-1">
                                                <li>การผันผวนของอุณหภูมิห้องปฏิบัติการขณะวัดค่า</li>
                                                <li>ไฟฟ้านิ่ง/สัญญาณรบกวน (Noise) ในเครื่องมือวัดวัด UV-Vis</li>
                                                <li>การกะปริมาตรหยดสุดท้ายของการไทเทรตในแต่ละครั้ง</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>

                                {/* Evaluation Rubric Card */}
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl text-xs space-y-3">
                                    <h2 className="text-base font-bold text-white flex items-center">
                                        <i className="fa-solid fa-list-check text-emerald-400 mr-2"></i>
                                        เกณฑ์การประเมินผลการเรียนรู้ (Evaluation Rubric)
                                    </h2>
                                    <table className="w-full text-left border-collapse border border-slate-700">
                                        <thead>
                                            <tr className="bg-slate-900 text-slate-300">
                                                <th className="p-2 border border-slate-700">ประเด็น</th>
                                                <th className="p-2 border border-slate-700 text-emerald-400">ดีมาก (3 คะแนน)</th>
                                                <th className="p-2 border border-slate-700 text-amber-400">ปานกลาง (2 คะแนน)</th>
                                                <th className="p-2 border border-slate-700 text-rose-400">ต้องปรับปรุง (1 คะแนน)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-slate-300 divide-y divide-slate-700">
                                            <tr>
                                                <td className="p-2 border border-slate-700 font-semibold">Root Cause Identification</td>
                                                <td className="p-2 border border-slate-700">ระบุสาเหตุรากเหง้าได้ถูกต้องตามหลักเคมีวิเคราะห์อย่างชัดเจน</td>
                                                <td className="p-2 border border-slate-700">ระบุสาเหตุได้ แต่เป็นเพียงปัจจัยแวดล้อม</td>
                                                <td className="p-2 border border-slate-700">ระบุสาเหตุไม่ถูกต้อง หรือไม่ตรงกับอาการที่พบ</td>
                                            </tr>
                                            <tr>
                                                <td className="p-2 border border-slate-700 font-semibold">Error Classification</td>
                                                <td className="p-2 border border-slate-700">จำแนก Systematic / Random Error ได้ถูกต้องพร้อมเหตุผล</td>
                                                <td className="p-2 border border-slate-700">จำแนกประเภท Error ถูกต้อง แต่เหตุผลยังไม่ชัดเจน</td>
                                                <td className="p-2 border border-slate-700">จำแนกประเภท Error ผิดพลาด</td>
                                            </tr>
                                            <tr>
                                                <td className="p-2 border border-slate-700 font-semibold">Corrective Action & Safety</td>
                                                <td className="p-2 border border-slate-700">เสนอแนวทางแก้ไขและ SOP ที่ทำได้จริงถูกต้องตามหลักความปลอดภัย</td>
                                                <td className="p-2 border border-slate-700">เสนอวิธีแก้ไขได้ แต่กว้างเกินไปหรือปฏิบัติตามยาก</td>
                                                <td className="p-2 border border-slate-700">เสนอแนวทางแก้ไขที่ไม่แก้ปัญหา หรือผิดหลักความปลอดภัย</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
